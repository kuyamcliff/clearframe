[package]
name = "clearframe-desktop"
description = "ClipFX Enhance desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "clipfx-enhance"

[[bin]]
name = "clipfx-enhance"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
cuda = ["clearframe-app/cuda"]
metal = ["clearframe-app/metal"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
clearframe-app.workspace = true
clearframe-core.workspace = true
clearframe-models.workspace = true
clearframe-pipeline.workspace = true
clearframe-media.workspace = true
clearframe-hardware.workspace = true
clearframe-inference.workspace = true

[dev-dependencies]
tempfile.workspace = true
