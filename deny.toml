# cargo-deny: every dependency must use an open-source license compatible
# with distributing ClearFrame under MIT. No paid or proprietary crates.
[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "MPL-2.0", "0BSD", "CDLA-Permissive-2.0",
]


[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
