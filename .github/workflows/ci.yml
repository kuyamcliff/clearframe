name: CI

on:
  push:
    branches: [main, "ccr-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Matches rust-toolchain.toml so local checks and CI agree.
  RUST_VERSION: "1.99.0"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: FFmpeg (macOS, built from source with vid.stab and zimg)
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/fetch-ffmpeg.ps1
          "CLIPFX_FFMPEG_DIR=$((Resolve-Path apps/desktop/src-tauri/ffmpeg).Path)" >> $env:GITHUB_ENV
          (Resolve-Path apps/desktop/src-tauri/ffmpeg).Path >> $env:GITHUB_PATH
      - name: Frontend placeholder for the desktop crate
        shell: bash
        run: mkdir -p apps/desktop/dist && [ -f apps/desktop/dist/index.html ] || echo '<!doctype html><title>ClipFX Enhance</title>' > apps/desktop/dist/index.html
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude clearframe-desktop
      - name: Desktop crate builds
        run: cargo build -p clearframe-desktop
      - name: Model tests (downloads public weights, verified by SHA-256)
        env:
          CLIPFX_TEST_MODELS: "1"
        run: cargo test -p clearframe-pipeline --test models_e2e -- --test-threads=1

  gpu:
    # Every GPU kernel against the CPU reference, on each graphics API:
    # Vulkan (Mesa lavapipe), DirectX 12 (Microsoft WARP) and Metal (Apple GPU).
    name: GPU (${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, api: Vulkan }
          - { os: windows-2022, api: DirectX 12 }
          - { os: macos-14, api: Metal }
    runs-on: ${{ matrix.os }}
    env:
      CLIPFX_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Vulkan driver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary
      - name: GPU adapters
        shell: bash
        run: cargo run -q --release -p clearframe-cli -- hardware --json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get('gpu_adapters', d.get('hardware', {}).get('gpu_adapters')), indent=1))"
      - name: GPU matches CPU for every architecture
        run: cargo test --release -p clearframe-inference --features gpu --test gpu_parity -- --nocapture --test-threads=1
      # Every convolution split into 8-row bands and every dispatch in its own submission, as
      # happens on slow laptop GPUs (keeps each piece of work under the Windows TDR limit).
      - name: GPU matches CPU with short submissions
        env:
          CLIPFX_GPU_SUBMIT_MACS: "100000"
        run: cargo test --release -p clearframe-inference --features gpu --test gpu_parity -- --test-threads=1
      - name: Real model on the GPU (Real-ESRGAN AnimeVideo v3)
        shell: bash
        run: |
          root="$RUNNER_TEMP/cfx"
          cargo run -q --release -p clearframe-cli -- --data-root "$root" models install xinntao.realesr-animevideo-v3
          weights=$(find "$root" -name '*.safetensors' | head -1)
          echo "weights: $weights"
          cargo run --release -p clearframe-inference --features gpu --example gpubench -- "$weights" 320 180

  windows-e2e:
    # Every built-in preset, start to finish, on Windows: on the DirectX 12 GPU path (Microsoft
    # WARP, with work split into short submissions as on a laptop GPU) and on the CPU.
    name: Windows presets end to end
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: FFmpeg
        shell: pwsh
        run: ./packaging/windows/fetch-ffmpeg.ps1
      - name: Build the CLI
        run: cargo build --release -p clearframe-cli
      - name: Install every model
        shell: bash
        run: |
          root="$RUNNER_TEMP/cfx"
          for m in $(python -c "import json; print(' '.join(m['id'] for m in json.load(open('model-catalog/catalog.json'))['models']))"); do
            target/release/clipfx.exe --data-root "$root" models install "$m"
          done
      - name: Every preset on the GPU (DirectX 12)
        shell: bash
        env:
          CLIPFX_GPU_SUBMIT_MACS: "50000000"
        run: |
          export PATH="$PWD/apps/desktop/src-tauri/ffmpeg:$PATH"
          tools/e2e-presets.sh target/release/clipfx.exe "$RUNNER_TEMP/cfx" gpu:0 0.25
      # The GPU "fails" after a few submissions (as after a driver reset): exports must reopen the
      # GPU or finish on the CPU instead of failing.
      - name: GPU failure mid-export recovers
        shell: bash
        env:
          CLIPFX_GPU_FAIL_AFTER: "3"
          E2E_PRESETS: "anime-2x faces smooth-60 deblur"
        run: |
          export PATH="$PWD/apps/desktop/src-tauri/ffmpeg:$PATH"
          tools/e2e-presets.sh target/release/clipfx.exe "$RUNNER_TEMP/cfx" gpu:0 0.25
          grep -q "finished on the CPU" "$RUNNER_TEMP/cfx/e2e-gpu-0/anime-2x.log"
      - name: Every preset on the CPU
        shell: bash
        run: |
          export PATH="$PWD/apps/desktop/src-tauri/ffmpeg:$PATH"
          tools/e2e-presets.sh target/release/clipfx.exe "$RUNNER_TEMP/cfx" cpu 0.25

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/app.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/desktop/test-results

  catalog:
    name: Model catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Validate catalog schema, URLs and hashes format
        run: cargo run -q -p clearframe-cli -- catalog validate model-catalog/catalog.json
      - name: UI fixtures match the backend
        run: cargo test -p clearframe-app --test ui_fixtures

  licenses:
    name: Licenses and SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Rust SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
          mkdir -p sbom && find . -name '*.cdx.json' -not -path './target/*' -exec cp {} sbom/ \;
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm SBOM
        working-directory: apps/desktop
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@1.19.3 --omit dev --output-file ../../sbom/desktop-npm.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom

  windows-installer:
    name: Windows installer and app
    runs-on: windows-2022
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Bundle FFmpeg
        shell: pwsh
        run: ./packaging/windows/fetch-ffmpeg.ps1
      - name: Build NSIS installer
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles nsis
      - name: Install, upgrade, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          ./packaging/windows/test-installer.ps1 -Installer $setup.FullName
      - name: Install and open the app
        shell: pwsh
        run: |
          $setup = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:ProgramFiles "ClipFX Enhance"
          # The installer remembers the last folder (the test above ends with a custom one), so say where.
          Start-Process -FilePath $setup -ArgumentList @("/S", "/D=$dir") -Wait
          $exe = Join-Path $dir "ClipFXEnhance.exe"
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          New-Item -ItemType Directory -Force -Path screens | Out-Null

          # Self-test of the installed app, including a real GPU computation (DirectX 12 / WARP).
          $st = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath $exe -ArgumentList @("--self-test", "`"$st`"") -Wait -PassThru
          $report = Get-Content $st -Raw
          Write-Host $report
          Copy-Item $st screens/windows-selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
          $json = $report | ConvertFrom-Json
          if (-not $json.gpu.check.passed) { throw "GPU check failed: $($json.gpu | ConvertTo-Json -Depth 5)" }
          if (-not ($json.ffmpeg.vidstab -and $json.ffmpeg.zscale)) { throw "bundled FFmpeg lacks stabilization or HDR: $($json.ffmpeg | ConvertTo-Json)" }

          # Open the app with a real video and take a screenshot of what a user sees.
          $video = Join-Path $env:RUNNER_TEMP "Sample clip.mp4"
          & (Join-Path $dir "ffmpeg\ffmpeg.exe") -v error -y -f lavfi -i "testsrc2=size=640x360:rate=30" -t 3 -pix_fmt yuv420p $video
          $app = Start-Process -FilePath $exe -ArgumentList "`"$video`"" -PassThru
          Start-Sleep -Seconds 30
          $app.Refresh()
          if ($app.HasExited) { throw "the app exited with code $($app.ExitCode)" }
          Write-Host "window title: '$($app.MainWindowTitle)'"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path (Resolve-Path screens) "windows-app.png"))
          if ($app.MainWindowTitle -notmatch "ClipFX") { throw "no ClipFX Enhance window (title '$($app.MainWindowTitle)')" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: screens
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*-setup.exe

  linux-packages:
    name: Linux packages and app
    runs-on: ubuntu-24.04
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg mesa-vulkan-drivers imagemagick xvfb xdotool x11-utils gdb
      - name: Build deb, rpm, AppImage
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles deb,rpm,appimage
      - name: Install the .deb, self-test and open the app
        run: |
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          mkdir -p screens
          export HOME=$(mktemp -d)
          xvfb-run -a clipfx-enhance --self-test "$PWD/screens/linux-selftest.json" || (cat screens/linux-selftest.json; exit 1)
          cat screens/linux-selftest.json
          python3 -c "import json; d=json.load(open('screens/linux-selftest.json')); assert d['gpu']['check']['passed'], d['gpu']; assert d['ffmpeg']['vidstab'] and d['ffmpeg']['zscale'], d['ffmpeg']"
          ffmpeg -v error -y -f lavfi -i "testsrc2=size=640x360:rate=30" -t 3 -pix_fmt yuv420p "$RUNNER_TEMP/Sample clip.mp4"
          Xvfb :99 -screen 0 1600x960x24 & sleep 2
          DISPLAY=:99 xdpyinfo >/dev/null || { echo "the virtual display did not start"; exit 1; }
          # Open the app with a video and screenshot it; a single-colour screen means nothing rendered.
          shot() { # <name> [env...]
            local name=$1; shift
            env DISPLAY=:99 RUST_LOG=info "$@" clipfx-enhance "$RUNNER_TEMP/Sample clip.mp4" > "screens/$name.log" 2>&1 & local app=$!
            # WebKit on this 2-CPU, GPU-less VM can take a while: wait until the interface has
            # drawn (more than 50 colours on screen), up to two minutes.
            local t=0
            while [ $t -lt 120 ]; do
              sleep 5; t=$((t + 5))
              kill -0 $app
              DISPLAY=:99 import -window root "screens/$name.png"
              [ "$(identify -format %k "screens/$name.png")" -gt 50 ] && break
            done
            echo "rendered after ${t}s" >> "screens/$name.log"
            local win; win=$(DISPLAY=:99 xdotool search --name "ClipFX Enhance" | tail -1)
            echo "window: ${win:-none}" >> "screens/$name.log"
            if [ -z "$win" ]; then # where is the app stuck?
              sudo gdb -p $app -batch -ex "thread apply all bt 15" 2>&1 | grep -E "^Thread|^#" | head -150 >> "screens/$name.log" || true
            fi
            DISPLAY=:99 xwininfo -root -tree | head -40 >> "screens/$name.log"
            kill $app; wait $app 2>/dev/null || true
            identify -format %k "screens/$name.png"
          }
          colours=$(shot linux-app)
          echo "screenshot colours: $colours ($(grep -o 'rendered after [0-9]*s' screens/linux-app.log))"
          if [ "$colours" -le 50 ]; then
            echo "--- app output and X windows"; cat screens/linux-app.log
            echo "--- app log files"; find "$HOME" -name "*.log" -path "*ClipFX*" -exec tail -40 {} \; 2>/dev/null || true
            echo "--- kernel"; uname -r; sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone 2>&1 || true
            # Diagnosis only: does WebKit's sandbox (user namespaces) hold the window back?
            nosandbox=$(shot linux-app-no-sandbox WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1)
            echo "without the WebKit sandbox (diagnosis only): $nosandbox colours"
            grep -E "^window" screens/linux-app-no-sandbox.log || true
            # Tell a broken app from this VM's display: try without WebKit's GPU compositing.
            fallback=$(shot linux-app-no-compositing WEBKIT_DISABLE_COMPOSITING_MODE=1)
            echo "without GPU compositing: $fallback colours"
            [ "$fallback" -gt 50 ] || { echo "the app window rendered blank"; exit 1; }
            echo "::warning::The window rendered only with GPU compositing off on this runner's virtual display; see the screenshots."
          fi
          sudo apt-get remove -y clip-fx-enhance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshots
          path: screens
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  macos-app:
    name: macOS app
    runs-on: macos-14
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: FFmpeg (bundled into the app)
        uses: ./.github/actions/macos-ffmpeg
      - name: Build the .app
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles app
      - name: Self-test and open the app
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          bin=$(find "$app/Contents/MacOS" -type f -perm +111 | head -1)
          mkdir -p screens
          test -x "$app/Contents/Resources/ffmpeg/ffmpeg"
          # Without CLIPFX_FFMPEG_DIR the app must find the FFmpeg inside its own bundle.
          env -u CLIPFX_FFMPEG_DIR "$bin" --self-test "$PWD/screens/macos-selftest.json" || (cat screens/macos-selftest.json; exit 1)
          cat screens/macos-selftest.json
          python3 -c "import json; d=json.load(open('screens/macos-selftest.json')); assert d['gpu']['check']['passed'], d['gpu']; f=d['ffmpeg']; assert f['vidstab'] and f['zscale'] and '.app/Contents/' in f['path'] and '/Resources/ffmpeg/' in f['path'], f"
          ffmpeg -v error -y -f lavfi -i "testsrc2=size=640x360:rate=30" -t 3 -pix_fmt yuv420p "$RUNNER_TEMP/Sample clip.mp4"
          "$bin" "$RUNNER_TEMP/Sample clip.mp4" & pid=$!
          sleep 30
          kill -0 $pid
          screencapture -x screens/macos-app.png || true
          kill $pid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: screens
