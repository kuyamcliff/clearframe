[package]
name = "clearframe-inference"
description = "ClipFX Enhance reviewed model adapters implemented on candle (pure Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
# Cross-vendor GPU compute (Vulkan / DirectX 12 / Metal) for NVIDIA, AMD, Intel and Apple GPUs.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
rayon.workspace = true
gemm = { version = "0.19", features = ["rayon"] }
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
safetensors.workspace = true
