[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/models",
    "crates/inference",
    "crates/media",
    "crates/pipeline",
    "crates/hardware",
    "crates/app",
    "crates/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kuyamcliff/clearframe"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
candle-core = "0.9"
candle-nn = "0.9"
safetensors = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "5"
tempfile = "3"
log = { version = "0.4", features = ["std"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "json"] }
sysinfo = "0.32"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"

clearframe-core = { path = "crates/core" }
clearframe-media = { path = "crates/media" }
clearframe-models = { path = "crates/models" }
clearframe-inference = { path = "crates/inference" }
clearframe-pipeline = { path = "crates/pipeline" }
clearframe-hardware = { path = "crates/hardware" }
clearframe-app = { path = "crates/app" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3
