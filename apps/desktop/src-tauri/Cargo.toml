[package]
name = "clearframe-desktop"
description = "ClipFX Enhance desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "clipfx-enhance"

[[bin]]
name = "clipfx-enhance"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
cuda = ["clearframe-app/cuda"]
metal = ["clearframe-app/metal"]

[dependencies]
# Tauri's default features minus "dbus": with it, every window creation on Linux blocks on the
# desktop portal's colour-scheme query, so the window never appears where the portal does not
# answer (seen on CI; also slow or broken portals on real desktops). Light/dark then follows the
# GTK theme and the app's own theme setting.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
clearframe-app.workspace = true
clearframe-core.workspace = true
clearframe-models.workspace = true
clearframe-pipeline.workspace = true
clearframe-media.workspace = true
clearframe-hardware.workspace = true
clearframe-inference = { workspace = true, features = ["gpu"] }

[dev-dependencies]
tempfile.workspace = true
